<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CivicCare civic seal, Tamil Nadu style" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="seal-arc-top" d="M 10,50 A 40,40 0 0 1 90,50" />
    <path id="seal-arc-bottom" d="M 15,68 A 35,35 0 0 0 85,68" />
  </defs>

  <!-- Outer rings -->
  <circle cx="50" cy="50" r="48" fill="#A31F22"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#F2B705" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="38" fill="#FBF6EC"/>

  <!-- Border dots -->
  <g fill="#F2B705">
    <circle cx="14" cy="34" r="1.3"/><circle cx="11" cy="42" r="1.3"/><circle cx="10" cy="50" r="1.3"/>
    <circle cx="11" cy="58" r="1.3"/><circle cx="14" cy="66" r="1.3"/>
    <circle cx="86" cy="34" r="1.3"/><circle cx="89" cy="42" r="1.3"/><circle cx="90" cy="50" r="1.3"/>
    <circle cx="89" cy="58" r="1.3"/><circle cx="86" cy="66" r="1.3"/>
  </g>

  <!-- Original tiered gopuram (temple-tower) silhouette, generic style -->
  <g transform="translate(50,58)" fill="#A31F22">
    <!-- finial -->
    <circle cx="0" cy="-38" r="1.6" fill="#F2B705"/>
    <rect x="-0.8" y="-37" width="1.6" height="4" fill="#F2B705"/>
    <!-- tapering tiers, widest at base -->
    <polygon points="-4,-33 4,-33 6,-27 -6,-27"/>
    <polygon points="-6.5,-27 6.5,-27 9,-20 -9,-20"/>
    <polygon points="-9.5,-20 9.5,-20 12.5,-13 -12.5,-13"/>
    <polygon points="-13,-13 13,-13 16.5,-5 -16.5,-5"/>
    <polygon points="-17,-5 17,-5 20,3 -20,3"/>
    <!-- decorative tier lines -->
    <g stroke="#F2B705" stroke-width="0.6" opacity="0.8">
      <line x1="-6" y1="-27" x2="6" y2="-27"/>
      <line x1="-9" y1="-20" x2="9" y2="-20"/>
      <line x1="-12.5" y1="-13" x2="12.5" y2="-13"/>
      <line x1="-16.5" y1="-5" x2="16.5" y2="-5"/>
    </g>
    <!-- base plinth -->
    <rect x="-24" y="3" width="48" height="4" fill="#7A1418"/>
  </g>

  <!-- Text ring -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="6" letter-spacing="1" fill="#A31F22">
    <textPath href="#seal-arc-top" startOffset="50%" text-anchor="middle">GOVT. OF TAMIL NADU · DEMO</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="5.4" letter-spacing="2" fill="#A31F22">
    <textPath href="#seal-arc-bottom" startOffset="50%" text-anchor="middle">CIVIC GRIEVANCE PORTAL</textPath>
  </text>
</svg>
